<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fraud Analyser — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-logo">
      <div class="logo-icon">FA</div>
      <h1>Fraud Transaction Analyser</h1>
      <p>Digital Payment Security System</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required autofocus/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:13px;color:#888;">
      Don't have an account?
      <a href="{{ url_for('register') }}" style="color:#0d6efd;font-weight:600;">Register here</a>
    </p>
  </div>
</body>
</html>

{% extends "base.html" %}
{% block title %}Reports — Fraud Analyser{% endblock %}
 
{% block content %}
<div class="page-header">
  <h2>Fraud Reports & Analytics</h2>
</div>
 
<div class="charts-grid">
  <div class="chart-card">
    <h3>Top Merchants by Fraud Count</h3>
    <canvas id="merchantChart" height="260"></canvas>
  </div>
  <div class="chart-card">
    <h3>Fraud by Location</h3>
    <canvas id="locationChart" height="260"></canvas>
  </div>
  <div class="chart-card">
    <h3>Fraud by Hour of Day</h3>
    <canvas id="hourChart" height="260"></canvas>
  </div>
  <div class="chart-card">
    <h3>Fraud by Payment Method</h3>
    <canvas id="methodChart" height="260"></canvas>
  </div>
</div>
{% endblock %}
 
{% block scripts %}
<script>
const merchantData = {{ by_merchant | safe }};
const locationData = {{ by_location | safe }};
const hourData     = {{ by_hour | safe }};
const methodData   = {{ by_method | safe }};
 
const COLORS = ['#dc3545','#fd7e14','#ffc107','#0d6efd','#198754','#6f42c1','#20c997','#0dcaf0','#d63384','#6c757d'];
 
function barChart(id, data, label) {
  new Chart(document.getElementById(id), {
    type: 'bar',
    data: {
      labels: Object.keys(data),
      datasets:[{ label, data: Object.values(data),
        backgroundColor: COLORS, borderRadius: 6 }]
    },
    options: { plugins:{ legend:{display:false} },
      scales:{ y:{ beginAtZero:true } } }
  });
}
 
function lineChart(id, data, label) {
  const labels = Array.from({length:24}, (_,i) => i+':00');
  const values = labels.map((_,i) => data[i] || 0);
  new Chart(document.getElementById(id), {
    type: 'line',
    data: {
      labels,
      datasets:[{ label, data: values,
        borderColor:'#dc3545', backgroundColor:'rgba(220,53,69,0.1)',
        fill:true, tension:0.4, pointRadius:3 }]
    },
    options: { plugins:{ legend:{display:false} },
      scales:{ y:{ beginAtZero:true } } }
  });
}
 
function pieChart(id, data, label) {
  new Chart(document.getElementById(id), {
    type: 'doughnut',
    data: {
      labels: Object.keys(data),
      datasets:[{ label, data: Object.values(data),
        backgroundColor: COLORS, borderWidth:2, borderColor:'#fff' }]
    },
    options: { plugins:{ legend:{ position:'bottom' } }, cutout:'50%' }
  });
}
 
barChart('merchantChart', merchantData, 'Fraud Count');
barChart('locationChart', locationData, 'Fraud Count');
lineChart('hourChart',    hourData,     'Fraud by Hour');
pieChart('methodChart',   methodData,   'Fraud Count');
</script>
{% endblock %}
